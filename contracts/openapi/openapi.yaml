openapi: 3.1.0
info:
  title: LedgerMeadow API
  version: 1.0.0
  description: Go-owned authenticated financial API. Monetary amounts are decimal strings in minor units.
servers:
  - url: http://127.0.0.1:8080
security:
  - clerkBearer: []
paths:
  /api/v1/bank-connections/link-token:
    post:
      operationId: createLinkToken
      responses:
        "200":
          description: Plaid Link token created.
          content: {application/json: {schema: {$ref: "#/components/schemas/LinkTokenResponse"}}}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "502": {$ref: "#/components/responses/ProviderUnavailable"}
  /api/v1/bank-connections/exchange:
    post:
      operationId: exchangePublicToken
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: "#/components/schemas/ExchangePublicTokenRequest"}}}
      responses:
        "202":
          description: Connection persisted and sync queued.
          content: {application/json: {schema: {$ref: "#/components/schemas/ExchangePublicTokenResponse"}}}
        "400": {$ref: "#/components/responses/InvalidRequest"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "502": {$ref: "#/components/responses/ProviderUnavailable"}
  /api/v1/bank-connections:
    get:
      operationId: listBankConnections
      responses:
        "200":
          description: Persisted bank connections.
          content: {application/json: {schema: {$ref: "#/components/schemas/BankConnectionsResponse"}}}
        "401": {$ref: "#/components/responses/Unauthenticated"}
  /api/v1/bank-connections/{id}:
    delete:
      operationId: disconnectBankConnection
      description: Revokes an owned Plaid Item and disconnects it while preserving financial history.
      parameters: [{$ref: "#/components/parameters/Id"}]
      responses:
        "204": {description: Bank connection revoked and disconnected.}
        "400": {$ref: "#/components/responses/InvalidRequest"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "404": {$ref: "#/components/responses/NotFound"}
        "502": {$ref: "#/components/responses/ProviderUnavailable"}
  /api/v1/accounts:
    get:
      operationId: listAccounts
      responses:
        "200":
          description: Persisted accounts and per-currency totals.
          content: {application/json: {schema: {$ref: "#/components/schemas/AccountsResponse"}}}
        "401": {$ref: "#/components/responses/Unauthenticated"}
  /api/v1/accounts/{id}:
    get:
      operationId: getAccount
      parameters: [{$ref: "#/components/parameters/Id"}]
      responses:
        "200": {description: Owned account with latest bounded transactions, content: {application/json: {schema: {$ref: "#/components/schemas/AccountDetailResponse"}}}}
        "400": {$ref: "#/components/responses/InvalidRequest"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/InvalidRequest"}
  /api/v1/bank-connections/{id}/refresh:
    post:
      operationId: refreshBankConnection
      parameters: [{$ref: "#/components/parameters/Id"}]
      responses:
        "202": {description: Idempotent connection sync queued, content: {application/json: {schema: {type: object, required: [status], properties: {status: {const: SYNC_PENDING}}}}}}
        "400": {$ref: "#/components/responses/InvalidRequest"}
        "404": {$ref: "#/components/responses/NotFound"}
  /api/v1/bank-connections/{id}/link-token:
    post:
      operationId: createBankConnectionUpdateLinkToken
      description: Creates a Plaid update-mode Link token for an owned connection; no products are added.
      parameters: [{$ref: "#/components/parameters/Id"}]
      responses:
        "200": {description: Short-lived Plaid update-mode Link token, content: {application/json: {schema: {$ref: "#/components/schemas/LinkTokenResponse"}}}}
        "400": {$ref: "#/components/responses/InvalidRequest"}
        "404": {$ref: "#/components/responses/NotFound"}
        "502": {$ref: "#/components/responses/ProviderUnavailable"}
  /api/v1/imports/rbc-csv/preview:
    post:
      operationId: previewRbcCsvImport
      description: Parses a bounded single-account RBC transaction CSV in memory and detects an existing imported account without persisting the file.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              additionalProperties: false
              required: [file]
              properties:
                file: {type: string, format: binary}
      responses:
        "200": {description: Validated RBC CSV summary with only a masked account identifier., content: {application/json: {schema: {$ref: "#/components/schemas/RbcCsvPreview"}}}}
        "400": {$ref: "#/components/responses/InvalidRequest"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "422": {$ref: "#/components/responses/InvalidRequest"}
  /api/v1/imports/rbc-csv:
    post:
      operationId: importRbcCsv
      description: Atomically imports a bounded RBC CSV into a file-backed account and queues financial materialization.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              additionalProperties: false
              required: [file]
              properties:
                file: {type: string, format: binary}
                # Required only when preview reports existing_account=false.
                current_balance_minor: {$ref: "#/components/schemas/NonNegativeMinorUnits"}
      responses:
        "201": {description: Import committed and materialization queued., content: {application/json: {schema: {$ref: "#/components/schemas/RbcCsvImportResponse"}}}}
        "400": {$ref: "#/components/responses/InvalidRequest"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "409": {$ref: "#/components/responses/InvalidRequest"}
        "422": {$ref: "#/components/responses/InvalidRequest"}
  /api/v1/transactions:
    get:
      operationId: listTransactions
      parameters:
        - {$ref: "#/components/parameters/Cursor"}
        - {$ref: "#/components/parameters/Limit"}
        - {name: account_id, in: query, schema: {type: string, format: uuid}}
        - {name: category_id, in: query, schema: {type: string, format: uuid}}
        - {name: space_id, in: query, schema: {type: string, format: uuid}}
        - {name: review_status, in: query, schema: {type: string, enum: [NEEDS_REVIEW, REVIEWED, IGNORED]}}
        - {name: current_month, in: query, schema: {type: boolean, default: false}}
        - {name: q, in: query, description: Indexed case-insensitive displayed merchant or transaction-name prefix., schema: {type: string, minLength: 2, maxLength: 80}}
      responses:
        "200":
          description: Bounded transaction page.
          content: {application/json: {schema: {$ref: "#/components/schemas/TransactionsResponse"}}}
        "400": {$ref: "#/components/responses/InvalidRequest"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
  /api/v1/transactions/bulk:
    patch:
      operationId: bulkUpdateTransactions
      description: Atomically updates at most 50 owned transactions and all persisted Space/budget derivatives.
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: "#/components/schemas/TransactionBulkUpdate"}}}
      responses:
        "204": {description: Transactions updated atomically.}
        "400": {$ref: "#/components/responses/InvalidRequest"}
        "404": {$ref: "#/components/responses/NotFound"}
        "422": {$ref: "#/components/responses/InvalidRequest"}
  /api/v1/transactions/{id}:
    get:
      operationId: getTransaction
      parameters: [{$ref: "#/components/parameters/Id"}]
      responses:
        "200":
          description: Transaction detail.
          content: {application/json: {schema: {$ref: "#/components/schemas/TransactionDetail"}}}
        "400": {$ref: "#/components/responses/InvalidRequest"}
        "404": {$ref: "#/components/responses/NotFound"}
    patch:
      operationId: updateTransaction
      parameters: [{$ref: "#/components/parameters/Id"}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: "#/components/schemas/TransactionUpdate"}}}
      responses:
        "204": {description: Transaction updated.}
        "400": {$ref: "#/components/responses/InvalidRequest"}
        "404": {$ref: "#/components/responses/NotFound"}
        "422": {$ref: "#/components/responses/InvalidRequest"}
  /api/v1/transactions/{id}/split:
    get:
      operationId: getExpenseSplit
      parameters: [{$ref: "#/components/parameters/Id"}]
      responses:
        "200": {description: Owned transaction split, content: {application/json: {schema: {$ref: "#/components/schemas/ExpenseSplit"}}}}
        "400": {$ref: "#/components/responses/InvalidRequest"}
        "404": {$ref: "#/components/responses/NotFound"}
        "422": {$ref: "#/components/responses/InvalidRequest"}
    put:
      operationId: replaceExpenseSplit
      parameters: [{$ref: "#/components/parameters/Id"}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: "#/components/schemas/ExpenseSplitReplace"}}}
      responses:
        "200": {description: Expense split replaced atomically, content: {application/json: {schema: {$ref: "#/components/schemas/ExpenseSplit"}}}}
        "400": {$ref: "#/components/responses/InvalidRequest"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/InvalidRequest"}
        "422": {$ref: "#/components/responses/InvalidRequest"}
    delete:
      operationId: clearExpenseSplit
      parameters: [{$ref: "#/components/parameters/Id"}]
      responses:
        "204": {description: Expense split cleared; transaction remains household-visible until explicitly made private.}
        "400": {$ref: "#/components/responses/InvalidRequest"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/InvalidRequest"}
        "422": {$ref: "#/components/responses/InvalidRequest"}
  /api/v1/categories:
    get:
      operationId: listCategories
      responses:
        "200":
          description: Bounded system and user category list.
          content:
            application/json:
              schema:
                type: object
                required: [categories]
                properties:
                  categories: {type: array, maxItems: 200, items: {$ref: "#/components/schemas/Category"}}
    post:
      operationId: createCategory
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: "#/components/schemas/CategoryCreate"}}}
      responses:
        "201": {$ref: "#/components/responses/Created"}
        "400": {$ref: "#/components/responses/InvalidRequest"}
        "422": {$ref: "#/components/responses/InvalidRequest"}
  /api/v1/spaces:
    get:
      operationId: listSpaces
      responses:
        "200":
          description: Bounded persisted Space list.
          content:
            application/json:
              schema:
                type: object
                required: [spaces]
                properties:
                  spaces: {type: array, maxItems: 100, items: {$ref: "#/components/schemas/Space"}}
    post:
      operationId: createSpace
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: "#/components/schemas/SpaceCreate"}}}
      responses:
        "201": {$ref: "#/components/responses/Created"}
        "400": {$ref: "#/components/responses/InvalidRequest"}
  /api/v1/bills:
    get:
      operationId: listBills
      responses:
        "200": {description: Bills, content: {application/json: {schema: {type: object, required: [bills], properties: {bills: {type: array, maxItems: 100, items: {$ref: "#/components/schemas/Bill"}}}}}}}
    post:
      operationId: createBill
      requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/BillCreate"}}}}
      responses: {"201": {$ref: "#/components/responses/Created"}, "400": {$ref: "#/components/responses/InvalidRequest"}}
  /api/v1/bills/{id}:
    get:
      operationId: getBill
      parameters: [{$ref: "#/components/parameters/Id"}]
      responses:
        "200": {description: Owned bill detail, content: {application/json: {schema: {$ref: "#/components/schemas/Bill"}}}}
        "400": {$ref: "#/components/responses/InvalidRequest"}
        "404": {$ref: "#/components/responses/NotFound"}
    patch:
      operationId: updateBill
      parameters: [{$ref: "#/components/parameters/Id"}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/BillUpdate"}}}}
      responses:
        "204": {description: Bill updated.}
        "400": {$ref: "#/components/responses/InvalidRequest"}
        "404": {$ref: "#/components/responses/NotFound"}
        "422": {$ref: "#/components/responses/InvalidRequest"}
  /api/v1/subscriptions:
    get:
      operationId: listSubscriptions
      responses:
        "200": {description: Subscriptions, content: {application/json: {schema: {type: object, required: [subscriptions], properties: {subscriptions: {type: array, maxItems: 100, items: {$ref: "#/components/schemas/Subscription"}}}}}}}
    post:
      operationId: createSubscription
      requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/SubscriptionCreate"}}}}
      responses: {"201": {$ref: "#/components/responses/Created"}, "400": {$ref: "#/components/responses/InvalidRequest"}}
  /api/v1/subscriptions/{id}:
    get:
      operationId: getSubscription
      parameters: [{$ref: "#/components/parameters/Id"}]
      responses:
        "200": {description: Owned subscription detail with bounded current-year payment history, content: {application/json: {schema: {$ref: "#/components/schemas/SubscriptionDetail"}}}}
        "400": {$ref: "#/components/responses/InvalidRequest"}
        "404": {$ref: "#/components/responses/NotFound"}
    patch:
      operationId: updateSubscription
      description: Replaces all editable subscription fields and validates related entities in the same tenant and currency.
      parameters: [{$ref: "#/components/parameters/Id"}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: "#/components/schemas/SubscriptionUpdate"}}}
      responses:
        "204": {description: Subscription updated.}
        "400": {$ref: "#/components/responses/InvalidRequest"}
        "404": {$ref: "#/components/responses/NotFound"}
        "422": {$ref: "#/components/responses/InvalidRequest"}
  /api/v1/recurring-income:
    get:
      operationId: listRecurringIncome
      responses:
        "200": {description: Detected recurring income, content: {application/json: {schema: {type: object, required: [recurring_income], properties: {recurring_income: {type: array, maxItems: 100, items: {$ref: "#/components/schemas/RecurringIncome"}}}}}}}
  /api/v1/recurring-income/{id}:
    get:
      operationId: getRecurringIncome
      parameters: [{$ref: "#/components/parameters/Id"}]
      responses:
        "200": {description: Owned recurring-income detail, content: {application/json: {schema: {$ref: "#/components/schemas/RecurringIncome"}}}}
        "400": {$ref: "#/components/responses/InvalidRequest"}
        "404": {$ref: "#/components/responses/NotFound"}
    patch:
      operationId: updateRecurringIncome
      parameters: [{$ref: "#/components/parameters/Id"}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/RecurringIncomeUpdate"}}}}
      responses:
        "204": {description: Recurring income updated.}
        "400": {$ref: "#/components/responses/InvalidRequest"}
        "404": {$ref: "#/components/responses/NotFound"}
        "422": {$ref: "#/components/responses/InvalidRequest"}
  /api/v1/budgets:
    get:
      operationId: listBudgets
      responses:
        "200": {description: Budgets, content: {application/json: {schema: {type: object, required: [budgets], properties: {budgets: {type: array, maxItems: 100, items: {$ref: "#/components/schemas/Budget"}}}}}}}
    post:
      operationId: createBudget
      requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/BudgetCreate"}}}}
      responses: {"201": {$ref: "#/components/responses/Created"}, "400": {$ref: "#/components/responses/InvalidRequest"}}
  /api/v1/goals:
    get:
      operationId: listGoals
      responses:
        "200": {description: Goals, content: {application/json: {schema: {type: object, required: [goals], properties: {goals: {type: array, maxItems: 100, items: {$ref: "#/components/schemas/Goal"}}}}}}}
    post:
      operationId: createGoal
      requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/GoalCreate"}}}}
      responses: {"201": {$ref: "#/components/responses/Created"}, "400": {$ref: "#/components/responses/InvalidRequest"}}
  /api/v1/rules:
    get:
      operationId: listRules
      responses:
        "200": {description: Rules, content: {application/json: {schema: {type: object, required: [rules], properties: {rules: {type: array, maxItems: 100, items: {$ref: "#/components/schemas/Rule"}}}}}}}
    post:
      operationId: createRule
      requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/RuleCreate"}}}}
      responses: {"201": {$ref: "#/components/responses/Created"}, "400": {$ref: "#/components/responses/InvalidRequest"}}
  /api/v1/rules/{id}:
    patch:
      operationId: updateRule
      parameters: [{$ref: "#/components/parameters/Id"}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/RuleUpdate"}}}}
      responses:
        "204": {description: Rule fields or enabled state updated.}
        "400": {$ref: "#/components/responses/InvalidRequest"}
        "404": {$ref: "#/components/responses/NotFound"}
    delete:
      operationId: deleteRule
      parameters: [{$ref: "#/components/parameters/Id"}]
      responses:
        "204": {description: Rule deleted and remaining priorities compacted atomically.}
        "400": {$ref: "#/components/responses/InvalidRequest"}
        "404": {$ref: "#/components/responses/NotFound"}
  /api/v1/rules/{id}/duplicate:
    post:
      operationId: duplicateRule
      parameters: [{$ref: "#/components/parameters/Id"}]
      responses:
        "201": {$ref: "#/components/responses/Created"}
        "400": {$ref: "#/components/responses/InvalidRequest"}
        "404": {$ref: "#/components/responses/NotFound"}
  /api/v1/rules/reorder:
    put:
      operationId: reorderRules
      description: Replaces priorities atomically; the request must contain every current owned rule exactly once.
      requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/RuleReorder"}}}}
      responses:
        "204": {description: Priorities replaced.}
        "400": {$ref: "#/components/responses/InvalidRequest"}
        "409": {$ref: "#/components/responses/InvalidRequest"}
  /api/v1/planning:
    get:
      operationId: getPlanning
      responses:
        "200": {description: Bounded planning aggregate, content: {application/json: {schema: {$ref: "#/components/schemas/PlanningResponse"}}}}
  /api/v1/dashboard:
    get:
      operationId: getDashboard
      responses:
        "200": {description: Persisted dashboard read model, content: {application/json: {schema: {$ref: "#/components/schemas/DashboardResponse"}}}}
  /api/v1/activity-summary:
    get:
      operationId: getActivitySummary
      responses:
        "200": {description: Current synchronized Inbox and notification state, content: {application/json: {schema: {$ref: "#/components/schemas/ActivitySummary"}}}}
  /api/v1/changes:
    get:
      operationId: streamChanges
      responses:
        "200": {description: Authenticated resource change stream, content: {text/event-stream: {schema: {$ref: "#/components/schemas/ChangeEvent"}}}}
        "401": {$ref: "#/components/responses/Unauthenticated"}
  /api/v1/inbox:
    get:
      operationId: listInboxItems
      parameters: [{$ref: "#/components/parameters/Cursor"}, {$ref: "#/components/parameters/Limit"}]
      responses:
        "200": {description: Inbox page, content: {application/json: {schema: {$ref: "#/components/schemas/InboxResponse"}}}}
  /api/v1/inbox/{id}/resolve:
    post:
      operationId: resolveInboxItem
      parameters: [{$ref: "#/components/parameters/Id"}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: "#/components/schemas/InboxResolve"}}}
      responses:
        "204": {description: Item resolved.}
        "400": {$ref: "#/components/responses/InvalidRequest"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/InvalidRequest"}
  /api/v1/household:
    get:
      operationId: getHousehold
      responses:
        "200": {description: Household or null, content: {application/json: {schema: {$ref: "#/components/schemas/HouseholdResponse"}}}}
    post:
      operationId: createHousehold
      requestBody:
        required: true
        content: {application/json: {schema: {type: object, additionalProperties: false, required: [name], properties: {name: {type: string, minLength: 1, maxLength: 120}}}}}
      responses:
        "201": {$ref: "#/components/responses/Created"}
        "400": {$ref: "#/components/responses/InvalidRequest"}
        "409": {$ref: "#/components/responses/InvalidRequest"}
  /api/v1/notifications:
    get:
      operationId: listNotifications
      responses:
        "200": {description: Latest notifications, content: {application/json: {schema: {$ref: "#/components/schemas/NotificationsResponse"}}}}
  /api/v1/notifications/{id}/read:
    patch:
      operationId: markNotificationRead
      parameters: [{$ref: "#/components/parameters/Id"}]
      responses:
        "204": {description: Notification marked read}
        "404": {$ref: "#/components/responses/NotFound"}
  /api/v1/notification-preferences:
    get:
      operationId: getNotificationPreferences
      responses:
        "200": {description: Persisted preferences, content: {application/json: {schema: {$ref: "#/components/schemas/NotificationPreferencesResponse"}}}}
    patch:
      operationId: updateNotificationPreference
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: "#/components/schemas/NotificationPreference"}}}
      responses:
        "204": {description: Preference updated.}
        "400": {$ref: "#/components/responses/InvalidRequest"}
  /api/v1/manual-assets:
    get:
      operationId: listManualAssets
      responses:
        "200": {description: Manual assets, content: {application/json: {schema: {type: object, required: [assets], properties: {assets: {type: array, maxItems: 100, items: {$ref: "#/components/schemas/ManualAsset"}}}}}}}
    post:
      operationId: createManualAsset
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: "#/components/schemas/ManualAssetCreate"}}}
      responses:
        "201": {$ref: "#/components/responses/Created"}
        "400": {$ref: "#/components/responses/InvalidRequest"}
  /api/v1/manual-liabilities:
    get:
      operationId: listManualLiabilities
      responses:
        "200": {description: Manual liabilities, content: {application/json: {schema: {type: object, required: [liabilities], properties: {liabilities: {type: array, maxItems: 100, items: {$ref: "#/components/schemas/ManualLiability"}}}}}}}
    post:
      operationId: createManualLiability
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: "#/components/schemas/ManualLiabilityCreate"}}}
      responses:
        "201": {$ref: "#/components/responses/Created"}
        "400": {$ref: "#/components/responses/InvalidRequest"}
  /api/v1/net-worth:
    get:
      operationId: getNetWorth
      responses:
        "200": {description: Persisted net-worth components and Rust-owned historical snapshots, content: {application/json: {schema: {$ref: "#/components/schemas/NetWorthResponse"}}}}
  /api/v1/analytics:
    get:
      operationId: getAnalytics
      responses:
        "200": {description: Latest persisted Rust-owned analytics materializations, content: {application/json: {schema: {type: object, required: [snapshots], properties: {snapshots: {type: array, maxItems: 12, items: {$ref: "#/components/schemas/AnalyticsSnapshot"}}}}}}}
  /api/v1/cash-flow:
    get:
      operationId: getCashFlow
      responses:
        "200": {description: Six latest persisted Rust-owned cash-flow materializations per supported currency, content: {application/json: {schema: {type: object, required: [snapshots], properties: {snapshots: {type: array, maxItems: 12, items: {$ref: "#/components/schemas/CashFlowSnapshot"}}}}}}}
  /api/v1/timeline:
    get:
      operationId: getFinancialTimeline
      responses:
        "200": {description: Latest persisted Rust-owned financial timeline, content: {application/json: {schema: {type: object, required: [snapshots], properties: {snapshots: {type: array, maxItems: 2, items: {$ref: "#/components/schemas/TimelineSnapshot"}}}}}}}
  /api/v1/search:
    get:
      operationId: searchWorkspace
      parameters:
        - name: q
          in: query
          required: true
          schema: {type: string, minLength: 2, maxLength: 80}
          description: Case-insensitive name prefix; contains search is intentionally unsupported for indexed bounded access.
      responses:
        "200": {description: Bounded tenant-owned prefix matches, content: {application/json: {schema: {type: object, required: [results], properties: {results: {type: array, maxItems: 30, items: {$ref: "#/components/schemas/SearchResult"}}}}}}}
        "400": {$ref: "#/components/responses/InvalidRequest"}
  /api/v1/loans:
    get:
      operationId: listLoans
      responses:
        "200": {description: Bounded user-authorized manual loans, content: {application/json: {schema: {type: object, required: [loans], properties: {loans: {type: array, maxItems: 100, items: {$ref: "#/components/schemas/Loan"}}}}}}}
        "409": {$ref: "#/components/responses/InvalidRequest"}
    post:
      operationId: createLoan
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: "#/components/schemas/LoanCreate"}}}
      responses:
        "201": {$ref: "#/components/responses/Created"}
        "400": {$ref: "#/components/responses/InvalidRequest"}
  /api/v1/loans/{id}:
    get:
      operationId: getLoan
      parameters: [{$ref: "#/components/parameters/Id"}]
      responses:
        "200": {description: Owned loan and bounded payment history, content: {application/json: {schema: {$ref: "#/components/schemas/LoanDetail"}}}}
        "400": {$ref: "#/components/responses/InvalidRequest"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/InvalidRequest"}
    patch:
      operationId: updateLoan
      description: Replaces the user-maintained loan terms used by the Rust scenario calculator.
      parameters: [{$ref: "#/components/parameters/Id"}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: "#/components/schemas/LoanCreate"}}}
      responses:
        "204": {description: Loan updated.}
        "400": {$ref: "#/components/responses/InvalidRequest"}
        "404": {$ref: "#/components/responses/NotFound"}
  /api/v1/loans/{id}/scenario:
    post:
      operationId: calculateLoanScenario
      description: Validates the request and ownership before invoking the Rust Financial Engine. Returns 503 until its transport is configured.
      parameters: [{$ref: "#/components/parameters/Id"}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: "#/components/schemas/LoanScenarioRequest"}}}
      responses:
        "200": {description: Base and additional-payment amortization scenarios from the Rust Financial Engine, content: {application/json: {schema: {$ref: "#/components/schemas/LoanScenarioResponse"}}}}
        "400": {$ref: "#/components/responses/InvalidRequest"}
        "404": {$ref: "#/components/responses/NotFound"}
        "503": {$ref: "#/components/responses/FinancialEngineUnavailable"}
  /api/v1/webhooks/plaid:
    post:
      operationId: receivePlaidWebhook
      security: []
      parameters:
        - name: Plaid-Verification
          in: header
          required: true
          schema: {type: string}
      requestBody:
        required: true
        content: {application/json: {schema: {type: object, additionalProperties: true}}}
      responses:
        "204": {description: Verified webhook accepted.}
        "400": {$ref: "#/components/responses/InvalidRequest"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
components:
  securitySchemes:
    clerkBearer: {type: http, scheme: bearer, bearerFormat: JWT}
  parameters:
    Id: {name: id, in: path, required: true, schema: {type: string, format: uuid}}
    Cursor: {name: cursor, in: query, schema: {type: string, maxLength: 512}}
    Limit: {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 25}}
  responses:
    InvalidRequest:
      description: Request validation failed.
      content: {application/json: {schema: {$ref: "#/components/schemas/ErrorResponse"}}}
    Unauthenticated:
      description: Valid Clerk session required.
      content: {application/json: {schema: {$ref: "#/components/schemas/ErrorResponse"}}}
    ProviderUnavailable:
      description: Plaid could not complete the operation.
      content: {application/json: {schema: {$ref: "#/components/schemas/ErrorResponse"}}}
    FinancialEngineUnavailable:
      description: The configured Rust Financial Engine transport is unavailable.
      content: {application/json: {schema: {$ref: "#/components/schemas/ErrorResponse"}}}
    NotFound:
      description: Authorized resource not found.
      content: {application/json: {schema: {$ref: "#/components/schemas/ErrorResponse"}}}
    Created:
      description: Resource created.
      content: {application/json: {schema: {$ref: "#/components/schemas/IdResponse"}}}
  schemas:
    MinorUnits: {type: string, pattern: "^-?[0-9]+$"}
    NonNegativeMinorUnits: {type: string, pattern: "^[0-9]+$"}
    Currency: {type: string, enum: [CAD, USD]}
    ErrorResponse:
      type: object
      required: [code, message]
      properties: {code: {type: string}, message: {type: string}}
    IdResponse:
      type: object
      required: [id]
      properties: {id: {type: string, format: uuid}}
    LinkTokenResponse:
      type: object
      required: [link_token, expiration]
      properties: {link_token: {type: string}, expiration: {type: string, format: date-time}}
    ExchangePublicTokenRequest:
      type: object
      additionalProperties: false
      required: [public_token, institution_id, institution_name]
      properties:
        public_token: {type: string, maxLength: 4096}
        institution_id: {type: string, maxLength: 128}
        institution_name: {type: string, maxLength: 200}
    ExchangePublicTokenResponse:
      type: object
      required: [connection_id, status]
      properties: {connection_id: {type: string, format: uuid}, status: {const: SYNC_PENDING}}
    BankConnection:
      type: object
      required: [id, provider, institution_name, status]
      properties:
        id: {type: string, format: uuid}
        provider: {type: string, enum: [PLAID, FILE_IMPORT]}
        institution_name: {type: string}
        status: {type: string, enum: [SYNC_PENDING, SYNCING, READY, ERROR]}
        last_sync_at: {type: [string, "null"], format: date-time}
        last_error_code: {type: [string, "null"]}
    BankConnectionsResponse:
      type: object
      required: [connections]
      properties: {connections: {type: array, maxItems: 100, items: {$ref: "#/components/schemas/BankConnection"}}}
    Money:
      type: object
      required: [amount_minor, currency]
      properties: {amount_minor: {$ref: "#/components/schemas/MinorUnits"}, currency: {$ref: "#/components/schemas/Currency"}}
    Account:
      type: object
      required: [id, provider, name, type, balance_minor, currency]
      properties:
        id: {type: string, format: uuid}
        provider: {type: string, enum: [PLAID, FILE_IMPORT]}
        name: {type: string}
        official_name: {type: [string, "null"]}
        mask: {type: [string, "null"]}
        type: {type: string}
        subtype: {type: [string, "null"]}
        balance_minor: {$ref: "#/components/schemas/MinorUnits"}
        available_balance_minor: {anyOf: [{$ref: "#/components/schemas/MinorUnits"}, {type: "null"}]}
        currency: {$ref: "#/components/schemas/Currency"}
    AccountsResponse:
      type: object
      required: [accounts, totals]
      properties:
        accounts: {type: array, maxItems: 100, items: {$ref: "#/components/schemas/Account"}}
        totals: {type: array, maxItems: 2, items: {$ref: "#/components/schemas/Money"}}
    AccountTransaction:
      type: object
      required: [id, name, amount_minor, currency, date, status]
      properties:
        id: {type: string, format: uuid}
        name: {type: string}
        merchant_name: {type: [string, "null"]}
        amount_minor: {$ref: "#/components/schemas/MinorUnits"}
        currency: {$ref: "#/components/schemas/Currency"}
        date: {type: string, format: date}
        status: {type: string, enum: [PENDING, POSTED]}
    AccountDetailResponse:
      type: object
      required: [account, connection_id, transactions]
      properties:
        account: {$ref: "#/components/schemas/Account"}
        connection_id: {type: string, format: uuid}
        transactions: {type: array, maxItems: 50, items: {$ref: "#/components/schemas/AccountTransaction"}}
    RbcCsvPreview:
      type: object
      required: [account_name, existing_account, account_type, mask, currency, date_from, date_to, transaction_count, positive_total_minor, outflow_total_minor]
      properties:
        account_name: {type: string}
        existing_account: {type: boolean}
        account_type: {type: string, enum: [VISA, CHEQUING]}
        mask: {type: string, pattern: '^[0-9]{4}$'}
        currency: {$ref: "#/components/schemas/Currency"}
        date_from: {type: string, format: date}
        date_to: {type: string, format: date}
        transaction_count: {type: integer, minimum: 1, maximum: 10000}
        positive_total_minor: {$ref: "#/components/schemas/NonNegativeMinorUnits"}
        outflow_total_minor: {$ref: "#/components/schemas/NonNegativeMinorUnits"}
    RbcCsvImportResponse:
      type: object
      required: [account_id, connection_id, imported_count, duplicate_count, materialization_status]
      properties:
        account_id: {type: string, format: uuid}
        connection_id: {type: string, format: uuid}
        imported_count: {type: integer, minimum: 0, maximum: 10000}
        duplicate_count: {type: integer, minimum: 0, maximum: 10000}
        materialization_status: {const: QUEUED}
    Transaction:
      type: object
      required: [id, account_id, account_name, name, amount_minor, currency, date, status, category_source, is_recurring, review_status, visibility]
      properties:
        id: {type: string, format: uuid}
        account_id: {type: string, format: uuid}
        account_name: {type: string}
        name: {type: string}
        merchant_name: {type: [string, "null"]}
        amount_minor: {$ref: "#/components/schemas/MinorUnits"}
        currency: {$ref: "#/components/schemas/Currency"}
        date: {type: string, format: date}
        status: {type: string, enum: [PENDING, POSTED]}
        category_id: {type: [string, "null"], format: uuid}
        category_name: {type: [string, "null"]}
        category_source: {type: string, enum: [UNASSIGNED, AUTOMATIC, USER]}
        is_recurring: {type: boolean}
        space_id: {type: [string, "null"], format: uuid}
        space_name: {type: [string, "null"]}
        review_status: {type: string, enum: [NEEDS_REVIEW, REVIEWED, IGNORED]}
        visibility: {type: string, enum: [PRIVATE, HOUSEHOLD]}
    TransactionsResponse:
      type: object
      required: [transactions, next_cursor]
      properties:
        transactions: {type: array, maxItems: 100, items: {$ref: "#/components/schemas/Transaction"}}
        next_cursor: {type: [string, "null"]}
    TransactionDetail:
      allOf:
        - {$ref: "#/components/schemas/Transaction"}
        - type: object
          required: [allocations]
          properties:
            original_description: {type: [string, "null"]}
            authorized_date: {type: [string, "null"], format: date}
            allocations:
              type: array
              maxItems: 50
              items:
                type: object
                required: [space_id, space_name, amount_minor]
                properties:
                  space_id: {type: string, format: uuid}
                  space_name: {type: string}
                  amount_minor: {$ref: "#/components/schemas/MinorUnits"}
    TransactionUpdate:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        category_id: {type: string, maxLength: 36, description: Empty string clears category.}
        space_id: {type: string, maxLength: 36, description: Empty string clears allocations.}
        review_status: {type: string, enum: [NEEDS_REVIEW, REVIEWED, IGNORED]}
        visibility: {type: string, enum: [PRIVATE, HOUSEHOLD]}
    TransactionBulkUpdate:
      type: object
      additionalProperties: false
      required: [transaction_ids]
      minProperties: 2
      properties:
        transaction_ids: {type: array, minItems: 1, maxItems: 50, uniqueItems: true, items: {type: string, format: uuid}}
        category_id: {type: string, maxLength: 36, description: Empty string clears category.}
        space_id: {type: string, maxLength: 36, description: Empty string clears allocations.}
        review_status: {type: string, enum: [NEEDS_REVIEW, REVIEWED, IGNORED]}
    ExpenseSplitParticipantInput:
      type: object
      additionalProperties: false
      required: [user_id, amount_minor]
      properties:
        user_id: {type: string, format: uuid}
        amount_minor: {allOf: [{$ref: "#/components/schemas/MinorUnits"}], pattern: "^[1-9][0-9]*$"}
    ExpenseSplitReplace:
